    <script>
      /* Set Reading Plan from local JSON file and current Date */
      /* JSON: "date": "2020-12-1T09:00:00.000Z" */
      var today = new Date();
      function renderReadingPlan(data) {
          /* Build a map of "YYYY-MM-DD" → reading text */
          var dateMap = {};
          for (var i = 0; i < data.length; i++) {
              dateMap[data[i].date.split("T")[0]] = data[i].reading;
          }

          /* For each of the 15 displayed calendar days, show the reading only
           * if that date exists in the plan (i.e. it's a selected reading day). */
          var d = new Date(today.getTime());
          for (var j = 0; j < 15; j++) {
              if (j !== 0) d.setDate(d.getDate() - 1);
              var dateKey = d.getFullYear() + "-" +
                  (d.getMonth() + 1 < 10 ? "0" + (d.getMonth() + 1) : "" + (d.getMonth() + 1)) + "-" +
                  (d.getDate() < 10 ? "0" + d.getDate() : "" + d.getDate());
              var reading_id = "reading-" + j;
              var el = document.getElementById(reading_id);
              if (el && dateMap[dateKey]) {
                  el.getElementsByTagName('p')[0].innerHTML = dateMap[dateKey];
              }
          }
      }

      $(function() {
          initCustomPlanModal();

          /* Check for a shared plan in the URL (?share=book,chapter,date,days) */
          var shareParam = new URLSearchParams(window.location.search).get('share');
          if (shareParam) {
              var parts = shareParam.split(',');
              if (parts.length === 4) {
                  var sharedPlan = generateCustomPlan(
                      parseInt(parts[0], 10),
                      parseInt(parts[1], 10),
                      parts[2],
                      parts[3].split('-').map(function(d){ return parseInt(d, 10); })
                  );
                  if (sharedPlan && sharedPlan.length > 0) {
                      renderReadingPlan(sharedPlan);
                      /* Hide the custom plan settings button and share button */
                      var wrapper = document.getElementById('custom-plan-settings-wrapper');
                      if (wrapper) wrapper.style.display = 'none';
                      return;
                  }
              }
          }

          var customPlan = getCustomPlan();
          if (customPlan && customPlan.length > 0) {
              renderReadingPlan(customPlan);
          } else {
              $.getJSON('reading_plan/reading_plan_brisbane_yp.json', renderReadingPlan);
          }
      });

      function shareCustomPlan() {
          var plan = getCustomPlan();
          if (!plan || plan.length === 0) {
              alert('Please generate a custom reading plan first.');
              return;
          }
          /* Read the saved plan params from localStorage */
          var stored = localStorage.getItem('custom_plan_params');
          if (!stored) {
              alert('Could not read plan parameters. Please regenerate your plan.');
              return;
          }
          var params = JSON.parse(stored);
          var shareValue = params.startBookIdx + ',' + params.startChapter + ',' +
              params.startDateStr + ',' + params.selectedDays.join('-');
          var shareUrl = window.location.origin + window.location.pathname + '?share=' + encodeURIComponent(shareValue);
          window.prompt('Copy this link to share your reading plan:', shareUrl);
      }
    </script>

            </div>

    <script>
      /* Set Date for Date Cards */
      const shortMonthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      var weekDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const d = new Date();
      for (var i = 0; i < 15; i++) {
          /* Subtract the Days */
          if (i !== 0) {
              d.setDate(d.getDate() - 1);
          }
          var monthNumber = d.getMonth();
          var month = shortMonthNames[monthNumber];
          var day = d.getDate();
          if (day < 10) { day = "0" + day; }
          var dayOfWeek = weekDays[d.getDay()];

          var month_id = "month-" + i;
          var day_id = "day-" + i;
          var dayOfWeek_id = "dayOfWeek-" + i;
          document.getElementById(month_id).innerHTML = month;
          document.getElementById(day_id).innerHTML = day;
          document.getElementById(dayOfWeek_id).innerHTML = dayOfWeek;
      }
    </script>
